# Blueprint Render.com untuk backend FastAPI SQUARE ADVENTURE (HTTPS gratis).
# Render Dashboard → New → Blueprint → pilih repo ini → isi nilai rahasia.
services:
  - type: web
    name: square-adventure-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STUDENT_PASSWORD_SECRET
        sync: false
      - key: STUDENT_EMAIL_DOMAIN
        value: siswa.squareadventure.id
      - key: CORS_ORIGINS
        value: https://ajengazmiranur.github.io,http://localhost:5173,http://localhost:8000,capacitor://localhost,http://localhost,https://localhost
